$kind: http-request
url: "{{baseUrl}}/books/:bookId"
method: GET
pathVariables:
  bookId: "{{bookID}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"is in stock\", function () {\r

      \    pm.expect(pm.response.json()[\"current-stock\"]).to.be.above(0);\r

      });"
    language: text/javascript
settings: {}
order: 2000
