$kind: http-request
url: "{{baseUrl}}/orders"
method: GET
body:
  type: json
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      const response = pm.response.json();\r

      \r

      pm.test(\"Response is an array\", function () {\r

      \    pm.expect(response).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Every order has an ID\", function () {\r

      \    response.forEach(function (order) {\r

      \        pm.expect(order.id).to.exist;\r

      \    });\r

      });\r

      \r\n"
    language: text/javascript
settings: {}
order: 2000
